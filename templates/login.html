{% extends "base.html" %}

{% block content %}
<div class="edit-bill-card">
    <h2 class="section-title">Log In</h2>

    {% for message in get_flashed_messages() %}
        <p role="alert">{{ message }}</p>
    {% endfor %}

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   maxlength="254" autocomplete="username"
                   required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   maxlength="128" autocomplete="current-password"
                   required>
        </div>

        <button type="submit" class="btn-save">Log In</button>
    </form>

    <p>Need an account?
        <a href="{{ url_for('register') }}">Create one</a>
    </p>
</div>
{% endblock %}
